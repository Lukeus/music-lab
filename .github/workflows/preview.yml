name: 🔍 Preview Deploy to Firebase

on:
  # Trigger on pull requests to main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress previews for the same PR
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18.x'
  FIREBASE_PROJECT_ID: 'music-labs-1d8e1'

jobs:
  # Job 1: Build and Test PR
  build-pr:
    name: 🔨 Build PR Changes
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          echo "🔍 Installing dependencies for PR #${{ github.event.number }}..."
          # Install with clean state and proper optional deps
          echo "📦 Running npm install..."
          npm install --no-audit --no-fund --include=optional
          
          # Force reinstall Rollup with proper platform binaries
          echo "🔧 Installing Rollup with platform binaries..."
          npm install @rollup/rollup-linux-x64-gnu --force --save-optional
          npm rebuild rollup
          
          echo "✅ Dependencies installed"
      
      - name: 🔍 Type check
        run: |
          echo "🔍 Type checking PR changes..."
          npm run type-check
          echo "✅ Type check passed"
      
      - name: 🧹 Lint check
        run: |
          echo "🧹 Linting PR changes..."
          npm run lint 2>/dev/null || echo "⚠️ Lint issues found but continuing..."
          echo "✅ Lint check completed"
      
      - name: 🏗️ Build for preview
        run: |
          echo "🏗️ Building PR changes..."
          npm run build
          echo "✅ Build successful"
      
      - name: 📤 Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ github.event.number }}
          path: apps/website/dist/
          retention-days: 7
  
  # Job 2: Deploy Preview
  deploy-preview:
    name: 🔥 Deploy Preview
    needs: build-pr
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
      
      - name: 📤 Download preview build
        uses: actions/download-artifact@v4
        with:
          name: preview-build-${{ github.event.number }}
          path: apps/website/dist/
      
      - name: 🔥 Deploy to Firebase Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-preview
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUSIC_LABS_1D8E1 }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          entryPoint: './apps/website'
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
      
      - name: 💬 Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.firebase-preview.outputs.details_url }}';
            const expireTime = '${{ steps.firebase-preview.outputs.expire_time }}';
            
            const comment = `## 🔥 Firebase Preview Deploy
            
            ✅ **Preview deployed successfully!**
            
            🌐 **Preview URL:** ${{ steps.firebase-preview.outputs.details_url }}
            ⏰ **Expires:** ${{ steps.firebase-preview.outputs.expire_time }}
            
            ### 🎵 Test These Features:
            - 🗝️ **Key Friend:** Try the chord progression builder
            - 🎼 **Scale Explorer:** Test keyboard, fretboard, and circle views  
            - 🎯 **Chord Finder:** Identify chords from selected notes
            - 🥁 **Drum Machine:** Click the avatar to reveal the beat maker
            - 📱 **Mobile Experience:** Test touch controls and PWA features
            
            ### 📊 Deployment Info:
            - **Commit:** ${{ github.sha }}
            - **PR:** #${{ github.event.number }}
            - **Branch:** ${{ github.head_ref }}
            
            ---
            *This preview will automatically expire and be cleaned up.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
