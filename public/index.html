<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title"></title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body class="scroll-lock">
    <div class="parallax-background">
        <div class="parallax-icon icon-headphones" data-speed="2">🎧</div>
        <div class="parallax-icon icon-mic" data-speed="-3">🎤</div>
        <div class="parallax-icon icon-note1" data-speed="5">🎵</div>
        <div class="parallax-icon icon-note2" data-speed="-2">🎶</div>
        <div class="parallax-icon icon-synth" data-speed="3">🎹</div>
        <div class="parallax-icon icon-cassette" data-speed="-4">📼</div>
    </div>

    <div class="welcome-gate">
        <div class="welcome-content">
            <h1 id="welcome-heading"></h1>
            <p id="welcome-message"></p>
            <button class="enter-button">Enter</button>
        </div>
    </div>

    <header>
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">Because Music Matters</a>
                <div class="status-indicator" id="status-message">
                    <div class="status-dot"></div>
                </div>
                <a href="#" class="logo" id="logo-text"></a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="avatar-section">
                    <div class="avatar-container">
                        <img src="assets/images/lukeus-avatar.png" alt="Lukeus - Music Producer and Songwriter" class="avatar-image">
                        <div class="avatar-ring"></div>
                        <div class="avatar-pulse"></div>
                    </div>
                </div>
                <div class="hero-text">
                    <h1 id="hero-heading"></h1>
                    <p id="hero-paragraph"></p>
                </div>
            </div>
        </div>
    </section>

    <section class="lab-dashboard">
        <div class="container">
            <h2 class="section-title">
                <div class="section-icon">⚗️</div>
                Current Projects
            </h2>
            <div class="projects-grid">
                </div>
            </div>
        </div>
    </section>

    <section class="experiments">
        <div class="container">
            <h2 class="section-title">
                <div class="section-icon">🔬</div>
                Sound Experiments
            </h2>
            <div class="experiments-grid">
            </div>
        </div>
    </section>

    <section class="journal">
        <div class="container">
            <h2 class="section-title">
                <div class="section-icon">✍️</div>
                Creative Journal
            </h2>
            <div id="creative-journal-entries" class="journal-entries"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="social-links">
                <a href="https://open.spotify.com/artist/3NckmpFR1r92wBscpnbVXl?si=pNvmFrLvTFGIBu0KTAYlqQ" class="social-link" target="_blank">Spotify</a>
                <a href="https://soundcloud.com/lukeusmusic" class="social-link" target="_blank">SoundCloud</a>
                <a href="https://www.instagram.com/musiclukeus/" class="social-link" target="_blank">Instagram</a>
            </div>
            <p>&copy; 2025 Lukeus. All experiments are works in progress.</p>
        </div>
    </footer>

    <script src="js/main.js" type="module"></script>
</body>
</html>
